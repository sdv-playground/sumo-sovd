[package]
name = "sumo-sovd-orchestrator"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SUIT campaign orchestrator over SOVD — coordinates multi-ECU firmware updates"

[dependencies]
# SUIT manifest parsing + validation
sumo-onboard = { git = "https://github.com/tr-sdv-sandbox/sumo-rs.git", tag = "v0.1.1" }
sumo-processor = { git = "https://github.com/tr-sdv-sandbox/sumo-rs.git", tag = "v0.1.1" }
sumo-crypto = { git = "https://github.com/tr-sdv-sandbox/sumo-rs.git", tag = "v0.1.1" }
sumo-codec = { git = "https://github.com/tr-sdv-sandbox/sumo-rs.git", tag = "v0.1.1" }

# Shared SOVD flash execution engine (stage → reset → commit/rollback)
sumo-sovd-flash-engine = { path = "../engine" }

# SOVD REST API client
sovd-client = { git = "https://github.com/sdv-playground/SOVDd.git", branch = "main" }
sovd-core = { git = "https://github.com/sdv-playground/SOVDd.git", branch = "main" }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

# Utilities
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
thiserror = "1"
async-trait = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
sovd-api = { git = "https://github.com/sdv-playground/SOVDd.git", branch = "main" }
axum = "0.8"
parking_lot = "0.12"
