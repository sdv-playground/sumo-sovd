[package]
name = "sumo-map"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SW-mapping CLI — inventories installed software per VM via the x-ota-installed-manifest SOVD read, verifies its IVD signature, and diffs against a release"

[[bin]]
name = "sumo-map"
path = "src/main.rs"

[dependencies]
# SOVD REST API client — same git source the orchestrator pins.
sovd-client = { git = "https://github.com/sdv-playground/SOVDd.git", branch = "main" }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Encoding
base64 = "0.22"
hex = "0.4"

# ECDSA-P256-SHA256 signature verification (load PEM or DER public key)
p256 = { version = "0.13", features = ["ecdsa", "pem"] }

# Error handling
anyhow = "1"
